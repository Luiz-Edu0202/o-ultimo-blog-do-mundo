name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------
  # Lint — Ruff check + format check
  # -------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/local.txt

      - name: Install dependencies
        run: pip install -r requirements/local.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  # -------------------------------------------------------------------
  # Test — pytest with coverage
  # -------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/local.txt

      - name: Install dependencies
        run: pip install -r requirements/local.txt

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

      - name: Django system check
        run: python manage.py check --fail-level ERROR

  # -------------------------------------------------------------------
  # Security — pip-audit, Trivy (placeholder until M5)
  # -------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    needs: lint
    if: false  # Enabled in Milestone 5
    steps:
      - uses: actions/checkout@v4
      - run: echo "Security scans placeholder"

  # -------------------------------------------------------------------
  # Build — Docker multi-stage build, push to GHCR, Trivy image scan
  # Enabled in Milestone 4.
  # -------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SECRET_KEY=dummy-build-secret-key-not-used-at-runtime

      - name: Run Trivy vulnerability scan on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # -------------------------------------------------------------------
  # Deploy — Render deploy hook (placeholder until M5)
  # -------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: false  # Enabled in Milestone 5
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploy placeholder"
