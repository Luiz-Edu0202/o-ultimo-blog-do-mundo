name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------
  # Lint — Ruff check + format check
  # -------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/local.txt

      - name: Install dependencies
        run: pip install -r requirements/local.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  # -------------------------------------------------------------------
  # Test — pytest with coverage
  # -------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/local.txt

      - name: Install dependencies
        run: pip install -r requirements/local.txt

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

      - name: Django system check
        run: python manage.py check --fail-level ERROR

  # -------------------------------------------------------------------
  # Security — pip-audit, Trivy (placeholder until M5)
  # -------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    needs: lint
    if: false  # Enabled in Milestone 5
    steps:
      - uses: actions/checkout@v4
      - run: echo "Security scans placeholder"

  # -------------------------------------------------------------------
  # Build — Docker build + push to GHCR (placeholder until M4)
  # -------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: false  # Enabled in Milestone 4
    steps:
      - uses: actions/checkout@v4
      - run: echo "Docker build placeholder"

  # -------------------------------------------------------------------
  # Deploy — Render deploy hook (placeholder until M5)
  # -------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: false  # Enabled in Milestone 5
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploy placeholder"
