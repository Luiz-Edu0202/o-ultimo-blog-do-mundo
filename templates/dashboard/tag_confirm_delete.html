{% extends "dashboard/base_dashboard.html" %}

{% block title %}Excluir Tag{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-0 shadow-sm p-4 text-center">
      <div class="text-danger mb-3">
        <i class="bi bi-trash fs-1"></i>
      </div>
      <h1 class="h4 fw-bold">Excluir Tag</h1>
      <p class="text-muted">
        Tem certeza que deseja excluir a tag <strong>"#{{ object.name }}"</strong>?
      </p>

      <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-2 mt-4">
          <a href="{% url 'dashboard:tag_list' %}" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-danger">Sim, Excluir</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
